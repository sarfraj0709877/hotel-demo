<!DOCTYPE html>
<html>
<head>
    <title>Hotel Admin Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        h1 {
            color: #222;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c62828;
        }
    </style>
</head>

<body>

    <h1>Hotel Admin Panel</h1>

    <div class="dashboard">

        <div class="card">
            <h3>Total Bookings</h3>
            <p id="totalBookings">0</p>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <p>₹<span id="totalRevenue">0</span></p>
        </div>

    </div>

    <h2>Bookings</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Room</th>
                <th>Price</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Guests</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookingTable">
        </tbody>
    </table>

    <script>

        function loadBookings() {

            fetch("/bookings")
                .then(response => response.json())
                .then(bookings => {

                    const table =
                        document.getElementById("bookingTable");

                    table.innerHTML = "";

                    document.getElementById("totalBookings")
                        .textContent = bookings.length;

                    let totalRevenue = 0;

                    bookings.forEach((booking, index) => {

                        totalRevenue +=
                            Number(booking.price) || 0;

                        const row =
                            document.createElement("tr");

                        row.innerHTML = `
                            <td>${booking.name || ""}</td>
                            <td>${booking.phone || ""}</td>
                            <td>${booking.room || ""}</td>
                            <td>₹${booking.price || "0"}</td>
                            <td>${booking.checkin || ""}</td>
                            <td>${booking.checkout || ""}</td>
                            <td>${booking.guests || ""}</td>
                            <td>
                                <button
                                    class="delete-btn"
                                    onclick="deleteBooking(${index})">
                                    Delete
                                </button>
                            </td>
                        `;

                        table.appendChild(row);
                    });

                    document.getElementById("totalRevenue")
                        .textContent = totalRevenue;

                })
                .catch(error => {
                    console.log("Error:", error);
                });
        }


        function deleteBooking(index) {

            const confirmDelete =
                confirm("Are you sure you want to delete this booking?");

            if (!confirmDelete) {
                return;
            }

            fetch("/bookings/" + index, {
                method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {

                if (data.success) {
                    loadBookings();
                } else {
                    alert(data.message);
                }

            })
            .catch(error => {
                console.log("Error:", error);
            });
        }


        loadBookings();

    </script>

</body>
</html>
